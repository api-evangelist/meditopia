aid: meditopia
name: Meditopia
description: 'Meditopia is a holistic mental-wellbeing platform founded in 2017 that blends psychology,
  technology, and wellness to support the mental, emotional, and physical health of individuals and
  organizations. For consumers it ships a meditation and mindfulness mobile app (sleep programs, guided
  meditations, personalized assessments, self-guided content) available in nine-plus languages and used
  by 40+ million people across 60 countries. For organizations it offers Meditopia for Work: a modern
  Employee Assistance Program (EAP), 1-on-1 expert sessions, a WellnessPass benefits platform, online
  trainings, and Soul, an AI wellbeing coach. Meditopia is backed by Creandum. The company operates a
  consumer mobile app and a B2B web platform; it does not currently publish a public developer API,
  OpenAPI, developer portal, or /.well-known discovery surface. This profile was surfaced as a Creandum
  portfolio company and enriched by the API Evangelist pipeline.'
